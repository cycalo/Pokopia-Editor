[[settings]]
key = "key_turn_back"
type = "key"
default = ""
label = "Keyboard key: turn back"

[[settings]]
key = "key_ability"
type = "key"
default = ""
label = "Keyboard key: use the ability (as ZR)"

[[settings]]
key = "key_menu"
type = "key"
default = "F3"
label = "Keyboard key: open the list of Pokémon (as ZL + R3)"
description = "In the list: Up / Down move, Left / Right move by 10, L / R jump to the next letter, A or Enter chooses, B or Esc closes. The choice lasts until the next start."

# The code patches of the emulator version (an IPS for main build 76a489f3bd3642fa) but the two small-space ground writers, as a take_over point.

[[hooks."2.0.1"]]
name = "form_get"   # desired-form getter (entry): returns the form while transformed
target = "main+0x6671b0"
word = 0x528b48c8
kind = "take_over"

[[hooks."2.0.1"]]
name = "form_set"   # desired-form setter (entry): stores the form while transformed
target = "main+0x6671bc"
word = 0x528b48c8
kind = "take_over"

[[hooks."2.0.1"]]
name = "request_state"   # RequestState (entry): drops "back to human" while transformed
target = "main+0x2f14e0"
word = 0xd503237f
kind = "take_over"

[[hooks."2.0.1"]]
name = "probe"   # animation condition 0x56 (entry): no stand-up stretch for the player
target = "main+0x6f2310"
word = 0xd503237f
kind = "take_over"

[[hooks."2.0.1"]]
name = "char_setup"   # strh w8, [x25, #0xe94]: the model setup, loads the form's animations
target = "main+0x27cbd0"
word = 0x791d2b28
kind = "take_over"

[[hooks."2.0.1"]]
name = "player_tick"   # blr x8 in the player update: buttons, animations, flying
target = "main+0x2face0"
word = 0xd63f0100
kind = "take_over"

[[hooks."2.0.1"]]
name = "to_human"   # turns the player human for an interaction (entry): noted, the player turns back after it (talking)
target = "main+0x455580"
word = 0xd503237f
kind = "take_over"

[[hooks."2.0.1"]]
name = "motion_reset"   # releases every motion set (entry), in the world reset (end of a Link Play session): the mod forgets what it loaded
target = "main+0x8d12c0"
word = 0xd503237f
kind = "take_over"

[[hooks."2.0.1"]]
name = "face"   # mov w0, w21 before setting a player character's face: no underwater face 22 for a Pokemon (blank eyes)
target = "main+0x2666c4"
word = 0x2a1503e0
kind = "take_over"

[[hooks."2.0.1"]]
name = "chair_use"   # a player sits on a chair (entry): not while transformed (a Pokemon gets stuck there)
target = "main+0x7c1838"
word = 0xd503237f
kind = "take_over"

[[hooks."2.0.1"]]
name = "attach"   # puts a model on the player hand (entry): nothing for a transformed player (a picked-up item stuck at the feet)
target = "main+0x2a5d5c"
word = 0xd503237f
kind = "take_over"

[[hooks."2.0.1"]]
name = "bed_use"   # a player lies down on a bed (entry): not while transformed (a Pokemon gets stuck there)
target = "main+0x79d948"
word = 0xd503237f
kind = "take_over"

[[hooks."2.0.1"]]
name = "air_menu"   # tbz w8, #0 in the button handler (w8 = body flags, bit 0 in the air): the bag while flying
target = "main+0x3164a4"
word = 0x360000c8
kind = "take_over"
